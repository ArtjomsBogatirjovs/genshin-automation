[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "genshin-automation"
version = "0.1.0"
description = "Genshin automation tools"
requires-python = ">=3.12"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
